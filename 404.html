<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: #111;
      color: #ddd;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      line-height: 1.8;
    }
    main {
      max-width: 640px;
      text-align: center;
    }
    .code {
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #7cc4ff;
      line-height: 1;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.4rem;
      color: #fff;
      margin: 0 0 1rem;
      font-weight: 600;
    }
    p {
      margin: 0 0 1rem;
      color: #aaa;
    }
    a {
      color: #7cc4ff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .back {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.6rem 1.4rem;
      border: 1px solid #333;
      border-radius: 6px;
      color: #ddd;
      background: #1a1a1a;
      transition: border-color 0.2s, color 0.2s;
    }
    .back:hover {
      border-color: #7cc4ff;
      color: #fff;
      text-decoration: none;
    }
    footer {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid #333;
      font-size: 0.85rem;
      color: #666;
    }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>此页面不存在</h1>
    <p>此页面可能已被移动 / 删除，或是并未被创建。</p>
    <p>如果你正在寻找一个存在的页面，请检查自己是否输入了错误的url。</p>
    <footer>
      RPCN-Theme
    </footer>
  </main>
</body>
</html>
